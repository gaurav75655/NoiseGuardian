name: Build Noise Guardian APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android source ZIP not found"
            exit 1
          fi

          echo "Found source: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found in ZIP"
            find "$GITHUB_WORKSPACE/project" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/outputs/apk/debug/*" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK generated: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoiseGuardian-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
