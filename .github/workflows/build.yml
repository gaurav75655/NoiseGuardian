
name: Build Noise Guardian APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source ZIP
        run: |
          if [ ! -f NoiseGuardian-Android-Source.zip ]; then
            echo "Waiting for source ZIP upload"
            exit 0
          fi

      - name: Extract project
        run: |
          unzip -q NoiseGuardian-Android-Source.zip -d unpacked
          cp -R unpacked/NoiseGuardian/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoiseGuardian-APK
          path: app/build/outputs/apk/debug/app-debug.apk
