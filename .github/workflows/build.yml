name: Build Noise Guardian APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
          cd "$ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoiseGuardian-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
